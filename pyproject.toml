[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-skill-ecosystem"
version = "0.1.0"
description = "Developer infrastructure for validating and managing modular Codex skills"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
skill-ecosystem = "skill_ecosystem.cli:main"

[tool.setuptools]
package-dir = {"" = "ecosystem/src"}

[tool.setuptools.packages.find]
where = ["ecosystem/src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

