objectives:
  discoverability:
    - Make public product pages discoverable from initial HTML.
  indexing:
    - Keep account routes excluded while allowing canonical public routes.
  audiences_and_markets:
    - English-speaking SaaS evaluators.
  search_outcomes:
    - Verify readiness without promising rankings or indexing dates.
design_inputs:
  decision_ids:
    - design-decision-fixture
  constraints_consumed:
    - Preserve the approved content hierarchy and existing media.
  unresolved_dependencies: []
selected_strategy:
  summary: Use the framework metadata API and generate visibility assets from route data.
  rationale: This reuses the current rendering model and prevents metadata drift.
  existing_capabilities_reused:
    - Existing server rendering
    - Existing route data
  new_dependencies: []
alternatives:
  - name: Replace the application with a new rendering framework.
    rejection_reasons:
      - Initial HTML is already server rendered, so a rebuild is disproportionate.
    trade_offs:
      - Retains current framework constraints in exchange for lower migration risk.
